nome: Aggiorna prezzi MIMIT → Supabase

su:
 programma:
    - cron: '30 6 * * *'
 flusso di lavoro_invio:

lavori:
 prezzi di aggiornamento:
 corse su: ubuntu-latest
 minuti di timeout: 15

 passi:
      - nome: Deposito di pagamento
 usi: azioni/checkout@v4

      - nome: Configurazione di Node.js
 usi: azioni/setup-node@v4
 contro:
 versione del nodo: '20'

      - nome: Installa dipendenze
 corre: npm install node-fetch@3 csv-parse
 elenco di lavoro: . . . . . .github/scripts

      - nome: Scarica e importa CSV MIMIT → Supabase
 ambiente:
 SUPABASE_URL: ${{ segreti.SUPABASE_URL }}
 SUPABASE_SERVICE_KEY: ${{ segreti.SUPABASE_SERVICE_KEY }}
 corre: nodo .github/scripts/update-mimit.js

      - nome: Notifica risultata
 Se: sempre()
 corre: ecologico "Aggiornamento MIMIT completato"
